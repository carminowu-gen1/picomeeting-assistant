<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <title>小伐速記</title>
  <link rel="stylesheet" href="../ui/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="../icons/icon48.png" alt="" />
      <div>
        <h1>小伐速記 <small class="sub">會議摘要助理</small></h1>
        <div id="where" class="small muted">…</div>
      </div>
    </div>
    <button class="btn ghost icon" id="openOptions" title="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <a class="update" id="update" href="#" hidden></a>

  <!-- 唯一的主要按鈕 -->
  <section class="card hero">
    <button class="big" id="mainBtn" disabled>
      <span class="big-dot"></span><span id="mainLabel">開始記錄</span>
    </button>
    <div id="status" class="status small muted"></div>
    <div id="meters" class="meters" hidden>
      <div class="meter"><span>我</span><div class="bar"><div id="lvlMic" class="fill"></div></div></div>
      <div class="meter"><span>對方</span><div class="bar"><div id="lvlTab" class="fill"></div></div></div>
    </div>
  </section>

  <!-- 最近一場會議 -->
  <section class="card result" id="result" hidden>
    <div class="result-head">
      <b id="mTitle">會議</b>
      <span id="mMeta" class="small muted"></span>
    </div>
    <div id="summary" class="summary"></div>
    <div class="actions">
      <button class="btn" id="copyAll" title="複製摘要和逐字稿，貼到任何地方">📋 複製</button>
      <button class="btn primary" id="saveWord" title="下載 Word 檔">⬇ Word</button>
    </div>
  </section>

  <!-- 一直都在：看所有會議、改名、刪除、合併摘要 -->
  <button class="btn records" id="openLive" type="button" title="看所有會議：摘要、逐字稿、改名、刪除、合併摘要">📚 所有會議紀錄</button>

  <div id="toast" class="toast"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
